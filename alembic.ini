# Settings for Alembic, the tool that creates and changes tables.
#
# There is no database address in this file. The address is built from .env by
# database/migrations/env.py, which also applies the development vs production
# guard rails before connecting.

[alembic]
script_location = %(here)s/database/migrations
prepend_sys_path = .
# New migration files are named like 20261123_0001_login_tables.py
file_template = %%(year)d%%(month).2d%%(day).2d_%%(rev)s_%%(slug)s
timezone = UTC
path_separator = os
